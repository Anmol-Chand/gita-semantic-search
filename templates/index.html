<!-- templates/index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bhagavad Gita Semantic Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <h1 class="mb-4 text-center">🔍 Bhagavad Gita Semantic Search</h1>

        <!-- Search Form -->
        <form method="post" class="mb-4">
            <div class="input-group">
                <input type="text" name="query" class="form-control" placeholder="Ask a question... e.g. How to deal with anger?" required>
                <button class="btn btn-primary" type="submit">Search</button>
            </div>
        </form>

        <!-- Results -->
        {% if results %}
            <h4 class="mb-3">Top Matching Shlokas:</h4>
            <div class="list-group">
                {% for result in results %}
                    <div class="list-group-item">
                        <p class="mb-1"><strong>Shloka:</strong> {{ result.text }}</p>
                        <p class="mb-0 text-muted">Topic: {{ result.meta.topic }}, Chapter: {{ result.meta.chapter }}</p>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    </div>

</body>
</html>
